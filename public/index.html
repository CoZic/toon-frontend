<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .button-group {
            margin-top: 30px;
        }

        .button-group button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
            transition: background-color 0.3s ease;
        }

        .button-group button:hover {
            background-color: #0056b3;
        }

        .button-group button:active {
            background-color: #004085;
        }
    </style>
</head>
<body>
    <!-- 이 HTML 파일은 React 애플리케이션의 메인 페이지로 사용됩니다. -->
     
    <!-- 
    <div class="container">
        <h1>환영합니다!</h1>
        <p>서비스를 이용하시려면 로그인하거나 회원가입해주세요.</p>
        <div class="button-group">
            <button onclick="location.href='/login'">로그인</button>
            <button onclick="location.href='/register'">회원가입</button>
        </div>
    </div>
    -->

    <!-- 자바스크립트를 사용하지 않는 환경에 대한 안내 메시지입니다. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- React 애플리케이션이 그려질 '캔버스' 역할을 하는 부분입니다. 이 div가 반드시 필요합니다. -->
    <div id="root"></div>

</body>
</html>
